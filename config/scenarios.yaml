# Stress scenario library for Module B.
#
# Each systemic template is anchored to a historical episode and expressed at
# severity 1.0 (the full historical move). A detected event scales it:
#     severity = clip((impact - 4) / 6, 0.2, 1.0)          impact 7 -> 0.5, 10 -> 1.0
#     systematic credit factor z = credit_z * severity   (credit_z = std devs at full severity;
#     back-solving Vasicek from GFC-era default rates, ~3x long-run for spec grade, gives z ~ 1.4)
# Initial magnitudes are first estimates; scripts/calibrate_scenarios.py
# replaces market-factor shocks with moves measured over each episode window
# from FRED / market data and records them under `calibrated`.
#
# Units: rates_bp & spreads in basis points, equity/fx/commodity in percent,
# fx = % change of the foreign currency vs USD (negative = currency weakens).

trigger:
  min_impact: 7
  max_sentiment: -0.2         # only adverse news triggers a stress test
  min_sources: 2              # independent outlets in the story cluster (filings count alone)
  cooldown_hours: 6           # per scenario (systemic class or counterparty)
  escalation_step: 0.15       # within cooldown, re-run only if severity rises this much (or new countries)
  systemic_classes: [geopolitical, macroeconomic, credit_event, operational]
  idiosyncratic_classes: [credit_event, regulatory_legal, operational, management_change, earnings, merger_acquisition]

